services:
  bionicgpt-llm-api:
    container_name: bionicgpt-llm-api
    image: ghcr.io/bionic-gpt/llama-3-8b-chat:1.1.1
    platform: linux/amd64
    networks:
      - bionicgpt-network
  bionicgpt-embeddings-api:
    container_name: bionicgpt-embeddings-api
    image: ghcr.io/bionic-gpt/bionicgpt-embeddings-api:cpu-0.6
    platform: linux/amd64
    networks:
      - bionicgpt-network
  bionicgpt-chunking-engine:
    container_name: bionicgpt-chunking-engine
    image: downloads.unstructured.io/unstructured-io/unstructured-api:4ffd8bc
    platform: linux/amd64
    networks:
      - bionicgpt-network
  bionicgpt-postgresdb:
    container_name: bionicgpt-postgresdb
    image: ankane/pgvector
    platform: linux/amd64
    volumes:
      - bionicgpt-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bionic-gpt}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bionicgpt-network
  bionicgpt-db-migrations:
    container_name: bionicgpt-db-migrations
    image: ghcr.io/bionic-gpt/bionicgpt-db-migrations:1.11.26
    platform: linux/amd64
    environment:
      DATABASE_URL: ${APP_DATABASE_URL}
    depends_on:
      bionicgpt-postgresdb:
        condition: service_healthy
    networks:
      - bionicgpt-network
  bionicgpt-rag-engine:
    container_name: bionicgpt-rag-engine
    image: ghcr.io/bionic-gpt/bionicgpt-rag-engine:1.11.26
    platform: linux/amd64
    environment:
      APP_DATABASE_URL: ${APP_DATABASE_URL}
    depends_on:
      bionicgpt-postgresdb:
        condition: service_healthy
      bionicgpt-db-migrations:
        condition: service_completed_successfully
    networks:
      - bionicgpt-network
  bionicgpt:
    container_name: bionicgpt
    image: ghcr.io/bionic-gpt/bionicgpt:1.11.26
    platform: linux/amd64
    environment:
      DANGER_JWT_OVERRIDE: ${DANGER_JWT_OVERRIDE}
      APP_DATABASE_URL: ${APP_DATABASE_URL}
      VIRTUAL_PORT: ${VIRTUAL_PORT}
      VIRTUAL_HOST: ${VIRTUAL_HOST}
      LETSENCRYPT_HOST: ${LETSENCRYPT_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    depends_on:
      bionicgpt-postgresdb:
        condition: service_healthy
      bionicgpt-db-migrations:
        condition: service_completed_successfully
    networks:
      - bionicgpt-network
      - letsencrypt-network
volumes:
  bionicgpt-data:
    name: bionicgpt-data
networks:
  bionicgpt-network:
    name: bionicgpt-network
  letsencrypt-network:
    external: true
